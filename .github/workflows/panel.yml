name: Panel de canales · actualizar

on:
  schedule:
    - cron: "17 */6 * * *"  # cada 6 h (minuto 17 para evitar la congestión de la hora en punto)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write  # para guardar historico.json en el repo
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # cancelar a medias podría perder la lectura del día en historico.json

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Comprobaciones
        run: python test_dashboard.py

      - name: Generar index.html y anotar el histórico
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
          YT_ANALYTICS_TOKENS_JSON: ${{ secrets.YT_ANALYTICS_TOKENS_JSON }}
        run: mkdir -p sitio && python actualizar_dashboard.py sitio/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

      - id: despliegue
        uses: actions/deploy-pages@v4

      # Los commits hechos con GITHUB_TOKEN no vuelven a lanzar este workflow, así que no hay bucle.
      - name: Guardar historico.json en el repositorio
        run: |
          git config user.name "panel-canales-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add historico.json
          if git diff --cached --quiet; then echo "Histórico sin cambios"; exit 0; fi
          git commit -m "Histórico: $(date -u +%F)"
          for intento in 1 2 3; do git pull --rebase && git push && exit 0; sleep 10; done
          exit 1
